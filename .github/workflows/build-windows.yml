name: Build Windows executable

# Builds a standalone c64renamer.exe on a Windows runner and uploads it as a
# downloadable artifact. When a version tag (v*) is pushed, it also publishes a
# GitHub Release with the .exe attached, giving a permanent download link.
#
# Run automatically on pushes/tags, or on demand from the Actions tab.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Import-check the GUI module
        run: python -c "import c64renamer.gui; print('GUI import OK')"

      - name: Build executable
        run: pyinstaller --clean --noconfirm c64renamer.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: c64renamer-windows
          path: dist/c64renamer.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/c64renamer.exe \
            --title "c64renamer ${GITHUB_REF_NAME}" \
            --notes "Standalone Windows build of c64renamer. Download **c64renamer.exe** from the Assets below and double-click it — no Python required. Windows SmartScreen may warn about the unsigned app: choose *More info -> Run anyway*."
