[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c64renamer"
version = "1.0.0"
description = "Identify C64 .d64/.t64/.crt files by the game inside them, rename them, and fetch cover art + screenshots."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# Core runs on the Python standard library alone -- no runtime dependencies.
dependencies = []

[project.scripts]
c64renamer = "c64renamer.cli:main"

[project.gui-scripts]
c64renamer-gui = "c64renamer.gui:main"

[project.optional-dependencies]
# Reading a local GameBase64 .mdb (pure-Python, no Access/ODBC driver needed).
gb64 = ["access-parser>=0.0.6"]
# Needed to build the standalone Windows .exe (bundles the gb64 reader too).
build = ["pyinstaller>=6.0", "access-parser>=0.0.6"]

[tool.setuptools.packages.find]
include = ["c64renamer*"]
